name: college_roi
version: "1.0.0"
config-version: 2

profile: college_roi

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

vars:
  # Databricks model endpoint used by ai_query (prod only)
  ai_model_endpoint: databricks-meta-llama-3-3-70b-instruct
  # Majors to send to the AI when testing, e.g. --vars "{report_card_majors: ['nursing']}".
  # Empty = all majors
  report_card_majors: []

models:
  college_roi:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
