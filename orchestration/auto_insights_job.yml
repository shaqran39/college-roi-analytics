# Databricks Job: auto_insights_refresh
# Written by hand in the same format as college_roi_refresh_job.yml. Create the Job in the
# Databricks UI to match it (or deploy it as a bundle).
# When a new CSV (any columns) lands in /Volumes/workspace/raw/auto_landing/, it runs
# auto_insights/profile_upload.py: load the newest CSV, profile it, write ONE AI report,
# all into the workspace.auto_insights schema. Separate from college_roi_refresh.
# Any failure stops the job and sends an email.
#
# No secrets in here. Fill in the variable for your own workspace:
#   alert_email: where failure emails go

variables:
  alert_email:
    description: Email address for job failure notifications

resources:
  jobs:
    auto_insights_refresh:
      name: auto_insights_refresh
      max_concurrent_runs: 1        # two uploads can't profile at the same time
      queue:
        enabled: true

      # Run when a new file arrives (new file names only; re-uploading the same name won't trigger)
      trigger:
        pause_status: UNPAUSED
        file_arrival:
          url: /Volumes/workspace/raw/auto_landing/
          min_time_between_triggers_seconds: 60
          wait_after_last_change_seconds: 60    # let a slow upload finish first

      email_notifications:
        on_failure:
          - ${var.alert_email}

      # Runs the code on main in GitHub
      git_source:
        git_url: https://github.com/shaqran39/college-roi-analytics
        git_provider: gitHub
        git_branch: main

      tasks:
        # Newest CSV in auto_landing -> latest_upload, profile tables, AI report
        - task_key: profile_upload
          spark_python_task:
            python_file: auto_insights/profile_upload.py
            source: GIT
          environment_key: auto-insights-default    # serverless: no cluster to set up
          max_retries: 0                            # a retry would make a second AI call

      environments:
        - environment_key: auto-insights-default
          spec:
            environment_version: "6"
            # no extra dependencies: in the Job the script uses spark.sql, not the connector
