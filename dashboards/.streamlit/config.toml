[theme]
# one calm accent + neutral greys, softly rounded corners. The font stays Streamlit's own (Source Sans),
# which charts use too. [theme.light] and [theme.dark] keep both modes readable; the light / dark switch still works.
primaryColor = "#2a78d6"
baseFontSize = 16
baseRadius = "0.6rem"
showWidgetBorder = true
headingFontWeights = [700, 650, 600]
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a"]

[theme.light]
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f3f2ef"
textColor = "#1f1e1c"
borderColor = "#dddcd7"
linkColor = "#1f62b3"

[theme.light.sidebar]
backgroundColor = "#f3f2ef"

[theme.dark]
primaryColor = "#3987e5"
backgroundColor = "#141413"
secondaryBackgroundColor = "#22221f"
textColor = "#f0efec"
borderColor = "#3a3935"
linkColor = "#7fb2f0"

[theme.dark.sidebar]
backgroundColor = "#1b1b19"

[client]
toolbarMode = "minimal"

[server]
# biggest upload in MB (the Auto insights uploader also checks this)
maxUploadSize = 10
